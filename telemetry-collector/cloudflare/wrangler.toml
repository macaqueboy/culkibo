name = "culkibo-telemetry-collector"
main = "worker.js"
compatibility_date = "2025-05-01"

[[d1_databases]]
binding = "DB"
database_name = "culkibo-telemetry"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

