<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" fill="none" role="img" aria-label="Animated Culkibo Live Sync 2.0 and inline MCP Apps topology demo showing 1.75 ms Merkle delta apply, -96.1% Brotli compression, Server-Timing 0.04 ms, and live ui://culkibo/topology card">
  <defs>
    <radialGradient id="lsAmber" cx="48%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lsEmerald" cx="84%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lsGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="lsBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseLine {
        0%, 100% { fill-opacity: 0.10; stroke-opacity: 0.35; }
        45% { fill-opacity: 0.24; stroke-opacity: 0.85; }
      }
      @keyframes packetFly {
        0% { transform: translateX(0px); opacity: 0; }
        18% { opacity: 1; }
        82% { opacity: 1; }
        100% { transform: translateX(48px); opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes flashBadge {
        0%, 35%, 100% { opacity: 0.78; }
        55%, 72% { opacity: 1; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes topoDot {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(74px); opacity: 0; }
      }
      .anim-edit { animation: pulseLine 3.2s ease-in-out infinite; }
      .anim-pkt-1 { animation: packetFly 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-pkt-2 { animation: packetFly 1.9s cubic-bezier(0.4, 0, 0.2, 1) 0.65s infinite; }
      .anim-pkt-3 { animation: packetFly 1.9s cubic-bezier(0.4, 0, 0.2, 1) 1.25s infinite; }
      .anim-dash { stroke-dasharray: 5 5; animation: dashFlow 1.2s linear infinite; }
      .anim-flash { animation: flashBadge 3.2s ease-in-out infinite; }
      .anim-cursor { animation: blinkCursor 1.1s step-end infinite; }
      .anim-topo-1 { animation: topoDot 2.2s linear infinite; }
      .anim-topo-2 { animation: topoDot 2.2s linear 0.75s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-edit, .anim-pkt-1, .anim-pkt-2, .anim-pkt-3, .anim-dash, .anim-flash, .anim-cursor, .anim-topo-1, .anim-topo-2 { animation: none; }
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="360" rx="16" fill="#09090B"/>
  <rect width="880" height="360" rx="16" fill="url(#lsGrid)"/>
  <rect width="880" height="360" rx="16" fill="url(#lsAmber)"/>
  <rect width="880" height="360" rx="16" fill="url(#lsEmerald)"/>
  <rect x="0.5" y="0.5" width="879" height="359" rx="15.5" stroke="#27272A" stroke-width="1"/>
  <rect x="1" y="1" width="878" height="3" rx="1.5" fill="url(#lsBar)"/>

  <!-- Header Bar -->
  <g transform="translate(20, 16)">
    <!-- Twin Planes K mini mark -->
    <rect width="26" height="26" rx="6" fill="#141418" stroke="#3F3F46" stroke-width="1"/>
    <rect x="6.8" y="5.5" width="3.2" height="15" rx="1" fill="#FFFFFF"/>
    <path d="M11.6 12.2L17.2 5.5H20.4L14.4 12.6L11.6 12.2Z" fill="#F59E0B"/>
    <path d="M11.6 13.8L14.5 13.4L20.6 20.5H17.1L11.6 13.8Z" fill="#FFFFFF"/>

    <text x="36" y="18" fill="#FAFAFA" class="sans" font-size="13.5" font-weight="700">Live Sync 2.0 (The Forge) + Inline MCP Apps</text>

    <!-- Live Metric Pills -->
    <rect x="466" y="2" width="108" height="22" rx="11" fill="#18181B" stroke="#F59E0B" stroke-opacity="0.45"/>
    <text x="520" y="17" text-anchor="middle" fill="#FBBF24" class="mono" font-size="11" font-weight="700">1.75 ms apply</text>

    <rect x="582" y="2" width="106" height="22" rx="11" fill="#18181B" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="635" y="17" text-anchor="middle" fill="#34D399" class="mono" font-size="11" font-weight="700">Brotli -96.1%</text>

    <rect x="696" y="2" width="144" height="22" rx="11" fill="#18181B" stroke="#3F3F46"/>
    <text x="768" y="17" text-anchor="middle" fill="#E4E4E7" class="mono" font-size="10.5" font-weight="600">cp;dur=0.04ms</text>
  </g>

  <!-- LEFT PANE: Local Editor + culkibo sync CLI -->
  <g transform="translate(20, 54)">
    <rect width="388" height="288" rx="12" fill="#111115" stroke="#27272A" stroke-width="1"/>

    <!-- Editor Header -->
    <circle cx="16" cy="16" r="4" fill="#3F3F46"/>
    <circle cx="30" cy="16" r="4" fill="#3F3F46"/>
    <circle cx="44" cy="16" r="4" fill="#3F3F46"/>
    <text x="62" y="20" fill="#A1A1AA" class="mono" font-size="11">src/api/pricing.ts</text>
    <rect x="292" y="7" width="84" height="18" rx="9" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="334" y="19" text-anchor="middle" fill="#FBBF24" class="mono" font-size="10" font-weight="700">SAVED ⌘S</text>
    <line x1="1" y1="32" x2="387" y2="32" stroke="#27272A" stroke-width="1"/>

    <!-- Editor Code Lines -->
    <g transform="translate(14, 48)" class="mono" font-size="11.5">
      <text x="0" y="12" fill="#52525B">1</text>
      <text x="20" y="12" fill="#A1A1AA"><tspan fill="#A78BFA">export</tspan> <tspan fill="#E4E4E7">const</tspan> <tspan fill="#34D399">computePlan</tspan> = (seats: number) =&gt; ({</text>

      <!-- Highlighted edited line -->
      <rect x="-6" y="22" width="372" height="22" rx="5" fill="#F59E0B" stroke="#F59E0B" stroke-width="1" class="anim-edit"/>
      <text x="0" y="37" fill="#FBBF24">2</text>
      <text x="20" y="37" fill="#FAFAFA">  tier: <tspan fill="#FBBF24">'pro'</tspan>, price: seats * 19, fast: true</text>
      <rect x="316" y="26" width="6" height="13" rx="1" fill="#F59E0B" class="anim-cursor"/>

      <text x="0" y="61" fill="#52525B">3</text>
      <text x="20" y="61" fill="#A1A1AA">}); <tspan fill="#52525B">// 0 Docker rebuilds · Merkle verified</tspan></text>
    </g>

    <!-- Terminal Divider -->
    <line x1="1" y1="132" x2="387" y2="132" stroke="#27272A" stroke-width="1"/>
    <rect x="1" y="133" width="386" height="154" rx="0" fill="#0C0C0F"/>

    <!-- Terminal Header -->
    <text x="14" y="152" fill="#71717A" class="mono" font-size="10.5" font-weight="700">TERMINAL · BINARY WS /ws/sync</text>
    <text x="374" y="152" text-anchor="end" fill="#10B981" class="mono" font-size="10.5">● CONNECTED</text>

    <!-- Terminal Output -->
    <g transform="translate(14, 174)" class="mono" font-size="11">
      <text x="0" y="0" fill="#F59E0B" font-weight="700">$</text>
      <text x="14" y="0" fill="#FAFAFA">culkibo sync proj_acme .</text>

      <text x="0" y="22" fill="#A1A1AA">▸ Merkle delta: 1 file changed (SHA-256 matched)</text>
      <text x="0" y="42" fill="#34D399">▸ Frame 0x02 Brotli: 1,420 B → 54 B (-96.1%)</text>
      <text x="0" y="62" fill="#FBBF24" font-weight="700">✓ Applied #42 in 1.75 ms · rollback ready (2.94 ms)</text>
      <text x="0" y="84" fill="#71717A">▸ Header: Server-Timing: cp;dur=0.04</text>
      <text x="0" y="102" fill="#C4B5FD">▸ MCP notify: ui://culkibo/topology synced</text>
    </g>
  </g>

  <!-- CENTER BRIDGE: Animated Binary WS + MCP Stream -->
  <g transform="translate(408, 122)">
    <text x="32" y="0" text-anchor="middle" fill="#FBBF24" class="mono" font-size="9.5" font-weight="700">/ws/sync</text>
    <line x1="2" y1="12" x2="62" y2="12" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.6" class="anim-dash"/>
    <circle cx="6" cy="12" r="3.5" fill="#FBBF24" class="anim-pkt-1"/>
    <circle cx="6" cy="12" r="2.8" fill="#34D399" class="anim-pkt-2"/>

    <text x="32" y="128" text-anchor="middle" fill="#C4B5FD" class="mono" font-size="9.5" font-weight="700">MCP 2026</text>
    <line x1="2" y1="140" x2="62" y2="140" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6" class="anim-dash"/>
    <circle cx="6" cy="140" r="3.2" fill="#C4B5FD" class="anim-pkt-3"/>
  </g>

  <!-- RIGHT TOP PANE: Live Browser Hot-Reload -->
  <g transform="translate(472, 54)">
    <rect width="388" height="126" rx="12" fill="#111115" stroke="#27272A" stroke-width="1"/>
    <!-- URL Bar -->
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <rect x="30" y="7" width="212" height="18" rx="6" fill="#18181B" stroke="#27272A"/>
    <text x="40" y="19" fill="#D4D4D8" class="mono" font-size="10.5">https://app.acme.dev/pricing</text>
    <rect x="252" y="7" width="124" height="18" rx="9" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.5" class="anim-flash"/>
    <text x="314" y="19" text-anchor="middle" fill="#34D399" class="mono" font-size="10" font-weight="700">HTTP/3 · 200 OK</text>
    <line x1="1" y1="32" x2="387" y2="32" stroke="#27272A" stroke-width="1"/>

    <!-- Live Hot-Reload Preview -->
    <g transform="translate(16, 46)">
      <rect width="356" height="64" rx="8" fill="#16161C" stroke="#10B981" stroke-opacity="0.35" class="anim-flash"/>
      <text x="14" y="24" fill="#FAFAFA" class="sans" font-size="13" font-weight="700">Pro Plan · $19/seat</text>
      <rect x="148" y="11" width="76" height="17" rx="8.5" fill="#F59E0B" fill-opacity="0.18"/>
      <text x="186" y="23" text-anchor="middle" fill="#FBBF24" class="mono" font-size="9.5" font-weight="700">LIVE RELOAD</text>
      <text x="14" y="48" fill="#A1A1AA" class="mono" font-size="10.5">Caddy v2.11 · TLS 1.3 · Server-Timing: cp;dur=0.04</text>
    </g>
  </g>

  <!-- RIGHT BOTTOM PANE: Inline MCP App (ui://culkibo/topology) -->
  <g transform="translate(472, 192)">
    <rect width="388" height="150" rx="12" fill="#111115" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.1"/>
    <!-- MCP App Header -->
    <rect x="12" y="10" width="144" height="19" rx="6" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="84" y="23" text-anchor="middle" fill="#C4B5FD" class="mono" font-size="10.5" font-weight="700">ui://culkibo/topology</text>
    <text x="166" y="23" fill="#A1A1AA" class="sans" font-size="11" font-weight="600">Claude / Antigravity</text>
    <rect x="304" y="10" width="72" height="19" rx="9.5" fill="#18181B" stroke="#3F3F46"/>
    <text x="340" y="23" text-anchor="middle" fill="#34D399" class="mono" font-size="9.5" font-weight="700">CSP strict</text>
    <line x1="1" y1="36" x2="387" y2="36" stroke="#27272A" stroke-width="1"/>

    <!-- Mini Spatial Topology Diagram -->
    <g transform="translate(18, 52)">
      <!-- Edge lines -->
      <line x1="94" y1="24" x2="136" y2="24" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.5" class="anim-dash"/>
      <line x1="226" y1="24" x2="268" y2="24" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" class="anim-dash"/>
      <circle cx="94" cy="24" r="3" fill="#FBBF24" class="anim-topo-1"/>
      <circle cx="196" cy="24" r="3" fill="#34D399" class="anim-topo-2"/>

      <!-- Node 1: Domain -->
      <rect x="0" y="4" width="94" height="42" rx="8" fill="#18181B" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="10" y="21" fill="#FBBF24" class="mono" font-size="9" font-weight="700">EDGE HTTP/3</text>
      <text x="10" y="36" fill="#FAFAFA" class="mono" font-size="10">app.acme.dev</text>

      <!-- Node 2: Project -->
      <rect x="136" y="4" width="90" height="42" rx="8" fill="#18181B" stroke="#34D399" stroke-opacity="0.55"/>
      <text x="146" y="21" fill="#34D399" class="mono" font-size="9" font-weight="700">● RUNNING</text>
      <text x="146" y="36" fill="#FAFAFA" class="mono" font-size="10">acme-api</text>

      <!-- Node 3: Database -->
      <rect x="268" y="4" width="84" height="42" rx="8" fill="#18181B" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="278" y="21" fill="#C4B5FD" class="mono" font-size="9" font-weight="700">POSTGRES</text>
      <text x="278" y="36" fill="#FAFAFA" class="mono" font-size="10">acme-db</text>

      <!-- Footer strip inside MCP App -->
      <rect x="0" y="58" width="352" height="24" rx="6" fill="#16161C" stroke="#27272A"/>
      <text x="12" y="74" fill="#D4D4D8" class="mono" font-size="10">111 MCP Tools · 13 Playbooks · 3 MCP Apps · -81.2% core</text>
    </g>
  </g>
</svg>
