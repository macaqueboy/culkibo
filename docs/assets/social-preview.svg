      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="48%" stop-color="#F59E0B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="14%" cy="92%" r="44%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
