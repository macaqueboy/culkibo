      <text x="0" y="38" fill="#71717A" font-family="ui-monospace, monospace" font-size="11.5">13 playbooks · -80% core</text>
      <text x="416" y="29" text-anchor="end" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="18" font-weight="800">111 Tools · 3 Apps</text>
