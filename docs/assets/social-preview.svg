    <rect width="68" height="68" rx="16" fill="#141418" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>
    <rect x="18" y="15" width="8.5" height="38" rx="2.6" fill="#FFFFFF"/>
    <path d="M30.8 32.1L45.2 15H53.5L38 33.1L30.8 32.1Z" fill="#F59E0B"/>
    <path d="M30.8 35.9L38.4 34.8L54 53H45L30.8 35.9Z" fill="#FFFFFF"/>

