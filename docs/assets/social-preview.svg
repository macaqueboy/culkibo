    <text x="88" y="45" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">Culkibo</text>

    <!-- License & Version Pill -->
    <rect x="242" y="18" width="176" height="30" rx="15" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="259" cy="33" r="4" fill="#10B981"/>
    <text x="272" y="38" fill="#D4D4D8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600">Apache-2.0 · v1.1</text>
  </g>

  <!-- Display Headline -->
  <text x="68" y="206" fill="#FAFAFA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.6">The 56 MB, Zero-Shell,</text>
  <text x="68" y="262" fill="#FAFAFA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.6">AI-Native Self-Hosted PaaS</text>

