      <text x="416" y="29" text-anchor="end" fill="#34D399" font-family="ui-monospace, monospace" font-size="19" font-weight="800">54–56 MB RSS</text>
    </g>
    <line x1="24" y1="128" x2="440" y2="128" stroke="#1E1E24" stroke-width="1"/>

