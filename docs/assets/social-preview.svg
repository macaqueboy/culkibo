      <stop offset="35%" stop-color="#3F3F46" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
