name: Culkibo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root and web dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Enforce runtime dependency budget (ROOT_DEPS=6, COLLECTOR_DEPS=0)
        run: |
          node -e "
            const rootPkg = require('./package.json');
            const collPkg = require('./telemetry-collector/package.json');
            const rootDeps = Object.keys(rootPkg.dependencies || {});
            const collDeps = Object.keys(collPkg.dependencies || {});
            console.log({ rootDepsCount: rootDeps.length, rootDeps, collectorDepsCount: collDeps.length });
            if (rootDeps.length !== 6) {
              console.error('Invariant violated: ROOT_DEPS must equal 6, got ' + rootDeps.length);
              process.exit(1);
            }
            if (collDeps.length !== 0) {
              console.error('Invariant violated: COLLECTOR_DEPS must equal 0, got ' + collDeps.length);
              process.exit(1);
            }
          "

      - name: Enforce static zero-shell invariant (shell:false)
        run: node tests/shell-safety.test.js

      - name: Validate VPS installer shell scripts syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install.sh

      - name: Server TypeScript check (checkJs)
        run: npm run typecheck

      - name: Frontend TypeScript check
        run: npx tsc -p web/tsconfig.app.json --noEmit

      - name: Frontend lint (0 warnings, 0 errors)
        run: npx --prefix web oxlint --deny-warnings

      - name: Frontend production build (Vite + precompressed .br/.gz)
        run: npm run web:build

      - name: Run full verification test suite
        env:
          DOCKER_BUILDKIT: '1'
        run: node tests/run-all.js

      - name: Run standalone live-server, WebSocket & HTTP stress suites
        if: matrix.node-version != '20'
        run: |
          node tests/live-server.test.js
          node tests/websocket-stress.test.js
          node tests/stress.test.js

      - name: Run zero-dep telemetry collector suite (Node >=22 node:sqlite)
        if: matrix.node-version != '20'
        run: node --disable-warning=ExperimentalWarning --test telemetry-collector/test/collector.test.js

  live-caddy-e2e:
    name: Live Caddy v2.11 Route Swap & Daemon Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build web dashboard
        run: |
          npm ci
          npm --prefix web ci
          npm run web:build

      - name: Start real Caddy v2.11 container on host loopback (:2019 admin API)
        run: |
          docker run -d --rm --name culkibo-ci-caddy --network host caddy:2.11-alpine caddy run
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:2019/config/ >/dev/null 2>&1; then
              echo "Caddy v2.11 Admin API ready on 127.0.0.1:2019"
              exit 0
            fi
            sleep 0.25
          done
          docker logs culkibo-ci-caddy || true
          exit 1

      - name: Run Caddy integration test suite
        run: node tests/caddy.test.js

      - name: Run live Caddy v2.11 atomic route-swap benchmark
        run: |
          node bench/route-swap.bench.js --json > /tmp/route-swap.json
          cat /tmp/route-swap.json
          node -e "
            const r = require('/tmp/route-swap.json');
            if (r.skipped || r.failures > 0 || r.p50Ms == null) {
              console.error('Live Caddy route-swap benchmark failed or skipped:', r);
              process.exit(1);
            }
            console.log('Live Caddy v2.11 route swap p50=' + r.p50Ms + 'ms p95=' + r.p95Ms + 'ms failures=' + r.failures);
          "

      - name: Live isolated daemon smoke test against Caddy v2.11
        run: |
          TMP_DATA="$(mktemp -d)"
          PORT=3042 HOST=127.0.0.1 CULKIBO_DATA_DIR="$TMP_DATA" CULKIBO_TELEMETRY=0 node server/index.js > /tmp/culkibo-caddy-smoke.log 2>&1 &
          DAEMON_PID=$!
          trap 'kill $DAEMON_PID 2>/dev/null || true; rm -rf "$TMP_DATA"' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3042/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:3042/health
          curl -fsS http://127.0.0.1:3042/api/system/status | grep -q '"status"'
          curl -fsS http://127.0.0.1:3042/api/system/edition | grep -q '"community"'
          curl -fsS http://127.0.0.1:3042/api/ingress/dns-providers | grep -q 'cloudflare'
          curl -fsS 'http://127.0.0.1:3042/api/mcp/tools?profile=core' | grep -q 'culkibo_ship_and_verify'

      - name: Stop Caddy container
        if: always()
        run: docker stop culkibo-ci-caddy 2>/dev/null || true

  playwright-visual-qa:
    name: Playwright Visual QA (Desktop 1440x900 & Mobile 390x844)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build web dashboard
        run: |
          npm ci
          npm --prefix web ci
          npm run web:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated daemon + Playwright Desktop & Mobile checks
        run: |
          mkdir -p /tmp/pw-qa-artifacts
          node -e "
            const { spawn } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { chromium } = require('playwright');

            (async () => {
              const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'culkibo-ci-pw-'));
              const port = 3043;
              const child = spawn(process.execPath, ['server/index.js'], {
                env: { ...process.env, PORT: String(port), HOST: '127.0.0.1', CULKIBO_DATA_DIR: tmpDir, CULKIBO_TELEMETRY: '0' },
                stdio: ['ignore', 'pipe', 'pipe']
              });
              try {
                let ready = false;
                for (let i = 0; i < 60; i++) {
                  try {
                    const r = await fetch('http://127.0.0.1:' + port + '/health');
                    if (r.ok) { ready = true; break; }
                  } catch {}
                  await new Promise(r => setTimeout(r, 250));
                }
                if (!ready) throw new Error('Daemon failed to start for Playwright QA');

                const browser = await chromium.launch({ headless: true });
                const checkViewport = async (name, viewport) => {
                  const ctx = await browser.newContext({ viewport, locale: 'en-US' });
                  const page = await ctx.newPage();
                  const consoleErrors = [];
                  const pageErrors = [];
                  const failedReqs = [];
                  page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
                  page.on('pageerror', e => pageErrors.push(String(e)));
                  page.on('response', r => { if (r.status() >= 400 && !r.url().includes('favicon')) failedReqs.push(r.status() + ' ' + r.url()); });

                  await page.goto('http://127.0.0.1:' + port + '/', { waitUntil: 'networkidle' });
                  await page.waitForTimeout(400);
                  const overflow = await page.evaluate(() => ({
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth
                  }));
                  await page.screenshot({ path: '/tmp/pw-qa-artifacts/' + name + '.png', fullPage: false });
                  await ctx.close();

                  console.log(name, { consoleErrors: consoleErrors.length, pageErrors: pageErrors.length, failedReqs: failedReqs.length, overflow });
                  if (consoleErrors.length || pageErrors.length || failedReqs.length) {
                    throw new Error(name + ' runtime errors: ' + JSON.stringify({ consoleErrors, pageErrors, failedReqs }));
                  }
                  if (overflow.scrollWidth > overflow.clientWidth) {
                    throw new Error(name + ' horizontal overflow: ' + JSON.stringify(overflow));
                  }
                };

                await checkViewport('desktop-1440x900', { width: 1440, height: 900 });
                await checkViewport('mobile-390x844', { width: 390, height: 844 });
                await browser.close();
              } finally {
                child.kill('SIGTERM');
                await new Promise(r => setTimeout(r, 300));
                try { fs.rmSync(tmpDir, { recursive: true, force: true }); } catch {}
              }
            })().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Upload Playwright QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-qa
          path: /tmp/pw-qa-artifacts/*.png
          if-no-files-found: ignore

  docker-smartpack-e2e:
    name: Docker BuildKit SmartPack E2E & CycloneDX 1.6 SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install root dependencies
        run: npm ci

      - name: Generate SmartPack build plan & Dockerfile for minimal Node app and build with BuildKit
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          APP_DIR="$(mktemp -d)"
          trap 'rm -rf "$APP_DIR"' EXIT
          cat > "$APP_DIR/package.json" <<'EOF'
          {
            "name": "culkibo-smartpack-smoke",
            "version": "1.0.0",
            "scripts": { "start": "node server.js" }
          }
          EOF
          cat > "$APP_DIR/server.js" <<'EOF'
          const http = require('http');
          const port = Number(process.env.PORT || 3000);
          http.createServer((_req, res) => {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ ok: true, builder: 'culkibo-smartpack' }));
          }).listen(port, '0.0.0.0', () => console.log('listening:' + port));
          EOF
          node bin/culkibo.js smartpack "$APP_DIR" --dockerfile --write-ignore --json > "$APP_DIR/smartpack.json"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const p = JSON.parse(fs.readFileSync(path.join(process.argv[1], 'smartpack.json'), 'utf8'));
            if (!p.ok || p.stack !== 'node' || !p.dockerfile || !p.deterministicHash) {
              console.error('Unexpected SmartPack payload:', p);
              process.exit(1);
            }
            fs.writeFileSync(path.join(process.argv[1], 'Dockerfile'), p.dockerfile, 'utf8');
            console.log('SmartPack verified:', { stack: p.stack, hash: p.deterministicHash, wroteIgnore: p.wroteIgnore, limits: p.resourceLimits });
          " "$APP_DIR"
          test -f "$APP_DIR/.dockerignore"
          docker buildx build --load -t culkibo-smartpack-smoke:ci "$APP_DIR"
          docker run --rm culkibo-smartpack-smoke:ci node -e "console.log('SMARTPACK_IMAGE_RUN_OK')"

      - name: Verify CycloneDX 1.6 SBOM & SHA-256 Provenance generation (npm run release:sbom)
        run: |
          OUT_DIR="$(mktemp -d)"
          trap 'rm -rf "$OUT_DIR"' EXIT
          npm run release:sbom -- --out-dir "$OUT_DIR" --json
          node -e "
            const fs = require('fs');
            const path = require('path');
            const outDir = process.argv[1];
            const sbom = JSON.parse(fs.readFileSync(path.join(outDir, 'sbom.cdx.json'), 'utf8'));
            if (sbom.bomFormat !== 'CycloneDX' || sbom.specVersion !== '1.6' || !Array.isArray(sbom.components) || sbom.components.length === 0) {
              throw new Error('Invalid CycloneDX 1.6 SBOM output');
            }
            const checksums = fs.readFileSync(path.join(outDir, 'CHECKSUMS.sha256'), 'utf8').trim();
            if (!checksums || checksums.split(/\r?\n/).length < 5) {
              throw new Error('CHECKSUMS.sha256 missing expected entries');
            }
            console.log('SBOM_AND_CHECKSUMS_OK:', {
              bomFormat: sbom.bomFormat,
              specVersion: sbom.specVersion,
              components: sbom.components.length,
              checksumFiles: checksums.split(/\r?\n/).length
            });
          " "$OUT_DIR"

